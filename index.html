<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Task Master</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-anim"></div>
  <div class="glass-container">
    <header>
        <h1>Task Command</h1>
        <p>Stay focused, Get things done.</p>
    </header>

    <div class="input-group">
      <div class="floating-input">
          <i class="fas fa-tasks icon"></i>
          <input type="text" id="taskInput" placeholder="What's your next mission?">
      </div>
      <div class="row">
          <div class="select-wrapper">
              <select id="priorityInput">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
              </select>
          </div>
          <div class="select-wrapper">
              <select id="categoryInput">
                <option value="Work">Work</option>
                <option value="Code">Code</option>
                <option value="Study">Study</option>
                <option value="Personal">Home</option>
                <option value="Health">Health</option>
              </select>
          </div>
      </div>
      <div class="row">
          <input type="datetime-local" id="timeInput">
          <button onclick="addTask()" class="add-btn">Add Mission</button>
      </div>
    </div>

    <div class="filter-bar">
        <span>Filter by Priority:</span>
        <div class="filter-options">
            <button onclick="filterTasks('All')" class="filter-btn active" id="btn-All">All</button>
            <button onclick="filterTasks('High')" class="filter-btn" id="btn-High">High</button>
            <button onclick="filterTasks('Medium')" class="filter-btn" id="btn-Medium">Med</button>
            <button onclick="filterTasks('Low')" class="filter-btn" id="btn-Low">Low</button>
        </div>
    </div>

    <div class="list-section">
        <h3><i class="fa-solid fa-bolt"></i> Active Missions</h3>
        <div id="taskList" class="task-grid"></div>
    </div>
    <div class="list-section">
        <h3><i class="fa-solid fa-check"></i> Completed History</h3>
        <div id="historyList" class="task-grid history-grid"></div>
    </div>
  </div>

  <script src="server.js"></script>
</body>
</html>
